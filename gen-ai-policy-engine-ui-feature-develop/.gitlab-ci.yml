  stage: dockerBuild
  image: docker:24.0.5
  services:
    - docker:dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - docker build -t $CI_REGISTRY/gadhs/ai-policy-engine/gen-ai-policy-engine-ui:uat .
    - docker push $CI_REGISTRY/gadhs/ai-policy-engine/gen-ai-policy-engine-ui:uat
  when: manual
  needs:
    - buildUat

dockerUatTest:
  stage: dockerTest
  image: docker:24.0.5
  services:
    - docker:dind
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - docker pull registry.gitlab.com/gadhs/ai-policy-engine/gen-ai-policy-engine-ui:uat
    - docker run --name webserver -d -p 80:80 registry.gitlab.com/gadhs/ai-policy-engine/gen-ai-policy-engine-ui:uat
