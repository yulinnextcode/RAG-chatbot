name: Deploy Backend Lambda

on:
  push:
    branches:
      - main
      - yulin
    paths:
      - 'gen-ai-policy-engine-backend-feature-develop/backend_lambda/**'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPO: 807336493430.dkr.ecr.us-west-2.amazonaws.com/policy-engine-backend
  LAMBDA_NAME: policy-engine-backend-lambda

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        working-directory: gen-ai-policy-engine-backend-feature-develop/backend_lambda
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_URI="${ECR_REPO}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" "${ECR_REPO}:latest"
          docker push "${ECR_REPO}:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Update Lambda to use new image
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_NAME}" \
            --image-uri "${IMAGE_URI}"
