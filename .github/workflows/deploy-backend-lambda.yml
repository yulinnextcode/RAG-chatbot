name: Deploy Backend Lambda to AWS

on:
  push:
    branches:
      - main
      - develop
      - yulin          # ✅ Added your branch
  workflow_dispatch:   # ✅ Allow manual run from Actions tab

env:
  AWS_REGION: us-west-2
  ECR_REPO: policy-engine-backend
  LAMBDA_NAME: policy-engine-backend-lambda

permissions:
  id-token: write      # Required for OIDC (no static credentials)
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: gen-ai-policy-engine-backend-feature-develop/backend_lambda
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          ECR_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}
          FULL_TAGGED_IMAGE="$ECR_URI:$IMAGE_TAG"

          echo "🔧 Building Docker image..."
          docker build -t "$FULL_TAGGED_IMAGE" .

          echo "📤 Pushing image to ECR..."
          docker push "$FULL_TAGGED_IMAGE"

          echo "🔖 Tagging image as latest..."
          docker tag "$FULL_TAGGED_IMAGE" "$ECR_URI:latest"
          docker push "$ECR_URI:latest"

          echo "IMAGE_URI=$FULL_TAGGED_IMAGE" >> $GITHUB_ENV

      - name: Update Lambda function to use new image
        run: |
          echo "🔄 Updating Lambda function..."
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_NAME }} \
            --image-uri "${{ env.IMAGE_URI }}"
